name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout idle engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libssl-dev \
            libpam0g-dev

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustc --version

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release libraries
        run: cargo build --release --workspace

      - name: Determine which packages to publish
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The packages pool is the source of truth for "already
          # distributed" — rebuilding an unchanged version produces
          # byte-different files that trip the importer's no-clobber guard.
          in_pool() {
            gh api "repos/idlescreen/packages/contents/rpm/pool/$1" \
              --jq .name >/dev/null 2>&1 || \
            gh api "repos/idlescreen/packages/contents/apt/pool/main/$2" \
              --jq .name >/dev/null 2>&1
          }
          ver() { grep -m1 '^version' "$1/Cargo.toml" | cut -d'"' -f2; }
          members=""
          for manifest in */libscreensaver_*.idleplugin.toml; do
            member="${manifest%%/*}"
            v=$(ver "$member")
            if ! in_pool "idle-saver-${member}-${v}-1.x86_64.rpm" "idle-saver-${member}_${v}-1_amd64.deb"; then
              members="$members $member"
            fi
          done
          v=$(ver meta)
          if ! in_pool "idle-savers-${v}-1.x86_64.rpm" "idle-savers_${v}-1_amd64.deb"; then
            members="$members meta"
          fi
          members="${members# }"
          echo "members=$members" >> "$GITHUB_OUTPUT"
          echo "to build: ${members:-<none>}"

      - name: Package changed members
        if: steps.plan.outputs.members != ''
        run: |
          set -euo pipefail
          # Saver members are identified by their plugin manifest — adding a
          # crate to the workspace with a libscreensaver_*.idleplugin.toml
          # automatically packages it; no list to keep in sync. `meta` is the
          # idle-savers bundle and packages from its own dir.
          for member in ${{ steps.plan.outputs.members }}; do
            if [ "$member" = "meta" ]; then
              (cd meta && cargo deb --no-build && cargo generate-rpm)
            else
              cargo deb --no-build -p "$member"
              cargo generate-rpm -p "$member"
            fi
          done

      - name: Install Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign packages with Cosign
        if: steps.plan.outputs.members != ''
        run: |
          shopt -s nullglob
          for file in target/debian/*.deb target/generate-rpm/*.rpm */target/generate-rpm/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        if: steps.plan.outputs.members != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Tag arrives via env, never expression interpolation into shell.
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*) echo "ERROR: invalid release tag '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_TAG}" -le 64 ] || { echo "ERROR: tag too long" >&2; exit 1; }
          shopt -s nullglob
          files=(
            target/debian/*.deb target/debian/*.sig target/debian/*.pem
            target/generate-rpm/*.rpm target/generate-rpm/*.sig target/generate-rpm/*.pem
            */target/generate-rpm/*.rpm */target/generate-rpm/*.sig */target/generate-rpm/*.pem
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::all packages already in the pool — release has no assets"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG" \
              "${files[@]}"
          fi

      - name: Trigger Packages Repository Update
        if: steps.plan.outputs.members != ''
        env:
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — packages repo will not update"
            exit 1
          fi
          # gh -f builds JSON-escaped fields — no raw tag interpolation.
          gh api repos/idlescreen/packages/dispatches \
            -X POST \
            -f event_type=new_release \
            -f "client_payload[repo]=${DISPATCH_REPO}" \
            -f "client_payload[tag]=${RELEASE_TAG}"
